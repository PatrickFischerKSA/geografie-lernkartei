<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 360" role="img" aria-labelledby="title desc"><title id="title">Fünf Breitenkreise von A bis E</title><desc id="desc">Auf einer Erdkugel sind fünf Breitenkreise von Norden nach Süden mit A, B, C, D und E markiert.</desc><rect width="620" height="360" fill="#f2f6ed" rx="16"/><circle cx="240" cy="180" r="143" fill="#e1eee8" stroke="#185364" stroke-width="2"/><ellipse cx="240" cy="180" rx="66" ry="143" fill="none" stroke="#8caeab"/><path d="M240 37V323" stroke="#8caeab"/><g fill="none" stroke="#185364" stroke-width="2"><ellipse cx="240" cy="57" rx="73" ry="12"/><ellipse cx="240" cy="124" rx="132" ry="23"/><ellipse cx="240" cy="180" rx="143" ry="29"/><ellipse cx="240" cy="236" rx="132" ry="23"/><ellipse cx="240" cy="303" rx="73" ry="12"/></g><g stroke="#608580" stroke-dasharray="4 4"><path d="M313 57H466M372 124H466M383 180H466M372 236H466M313 303H466"/></g><g fill="#185364" font-family="Arial,sans-serif" font-size="23" font-weight="bold"><text x="480" y="65">A</text><text x="480" y="132">B</text><text x="480" y="188">C</text><text x="480" y="244">D</text><text x="480" y="311">E</text></g><g font-family="Arial,sans-serif" font-size="14" fill="#567477"><text x="230" y="25">N</text><text x="232" y="347">S</text><text x="22" y="342">Schema</text></g></svg>
